# Config for the README demo. Not a template to copy: the harness is a fake
# agent and the source points at demo/stub_server.py, so nothing here touches a
# real tracker. See demo/README.md.

harness = "demo"
executor = "local"
activities_dir = "activities"

# `record.sh` puts demo/ on PYTHONPATH, so `-m agent` resolves to demo/agent.py
# no matter which directory the run happens in -- the harness runs with its cwd
# set to Tina's temporary workdir.
[harnesses.demo]
command = ["python3", "-m", "agent", "{prompt_file}", "{outcome_dir}"]

[bug]
source = "github"
repo = "acme/api"
query = "repo:acme/api is:issue is:open no:assignee label:bug"
activity = "triage"
result = "github:pr"
