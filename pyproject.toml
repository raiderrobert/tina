[project]
name = "tina-cli"
version = "0.1.0"
description = "An autonomous factory. Orchestration only: claim a work item, run an agent once, record the outcome."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.27.0",
]

[project.optional-dependencies]
cloudrun = [
    "google-cloud-run>=0.10",
]

[project.scripts]
tina = "tina.cli:main"

[project.urls]
Homepage = "https://github.com/raiderrobert/tina"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tina"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
