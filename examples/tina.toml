# Example Tina configuration.
#
# `harness` and `executor` select an adapter by name. The adapters themselves
# are defined in the plural tables below — TOML will not let a key be both a
# string and a table.

harness = "pi"
executor = "local"
tracks_dir = "tracks"

# The models the harness may run, as the exact strings {model} takes. When
# set, every track's `model` and every `run --model` override must be listed,
# and `tina doctor` proves each one answers. Unset means unconstrained.
# models = ["claude-sonnet-x", "gemini-flash-y"]

# Where to keep each run's harness session (transcript, tool calls, costs).
# After the harness exits, whatever it left in {session_dir} is copied to
# <artifacts_dir>/<item>/ — best-effort, any outcome. Unset skips the copy;
# {session_dir} still substitutes. A bucket mount is just a path.
# artifacts_dir = "/mnt/artifacts"

# Runtime policy (paused, max_concurrency) lives in a separate control file,
# read fresh on every dispatch. Optional; absent means defaults. The env vars
# TINA_CONTROL and TINA_CONTROL_INLINE override it — see docs/control.md.
# control = "/mnt/config/control.toml"

[harnesses.pi]
command = ["pi", "-p", "@{prompt_file}"]
# A command may also reference {model}; every track must then set `model`,
# so each track picks the model its work deserves:
# command = ["pi", "-p", "@{prompt_file}", "--model", "{model}"]
# And {session_dir}: a fresh directory per run where the harness writes its
# session, captured to artifacts_dir when that is set:
# command = ["pi", "-p", "@{prompt_file}", "--session-dir", "{session_dir}"]
# Output markers that mean "the failure clears on its own — run it again",
# each with a ladder of waits (one retry per entry). Most specific first: the
# first rule that matches decides the schedule.
# retry = [
#   { markers = ["Quota exceeded"], waits = [60, 300, 600], reason = "provider quota" },
#   { markers = ["overloaded_error", "RESOURCE_EXHAUSTED"], waits = [30, 120], reason = "capacity" },
# ]

[harnesses.claude]
command = ["claude", "-p", "@{prompt_file}", "--output-format", "json"]

[executors.cloudrun]
project = "acme-prod"
region = "us-central1"
job = "tina-worker"
# Or one job per track, so each gets its own machine size and timeout:
# job = "tina-{track}"

# Every other table is a track: source -> skill -> result.

[vul]
source = "jira"
query = "project = VUL AND status = Open AND assignee IS EMPTY"
track = "remediate"         # skill name under tracks_dir; defaults to the key
result = "github:pr"        # declaration only — the agent produces it
# max_concurrency = 4         # this track's cap on live workers. Opts out of the
#                             # control file's max_concurrency; paused still applies.
# model = "claude-sonnet-x"   # substituted for {model} in the harness command;
#                             # required exactly when the command references it
# claim = "assign"            # how the worker claims (ADR-014): "assign" the
#                             # bot (default), "label" applies claim_label, or
#                             # "none" — no claim, dedupe is the query's job
# claim_label = "bot-claimed" # required with claim = "label"; the query must
#                             # exclude it. Jira:
#                             #   AND (labels IS EMPTY OR labels != "bot-claimed")
#                             # GitHub: -label:bot-claimed
# claim_transition = "In Progress"  # jira only: transition applied after a
#                             # successful claim, so the queued status stays true
# enabled = true              # false ships the track without running it
# on_failure = "leave"        # "annotate": after a failed, needs_human, or
#                             # unverified run, comment the outcome on the
#                             # item and apply blocked_label
# blocked_label = "tina-blocked"  # the label block() applies after a bad run.
# The query must exclude it, or blocked items match again. Jira:
#   AND (labels IS EMPTY OR labels != "tina-blocked")
# GitHub: -label:tina-blocked
# blocked_transition = "Blocked"  # jira only: block() transitions to this
#                             # status instead; the query's status clause
#                             # already excludes it.

# Instead of `query`, a track may give the parts and let tina build it —
# the queued status, unassigned, not blocked, not claimed, oldest first are
# then tina's job, and onboarding a team is one array edit:
# [vul-by-team]
# source = "jira"
# project = "VUL"
# status = "Open"                       # the default
# extra = "labels not in (risk-exception)"
# [vul-by-team.filters]
# Squad = ["Reporting", "Site Experience"]

[bug]
source = "github"
repo = "acme/api"
query = "repo:acme/api is:issue is:open no:assignee label:bug"
track = "triage"
result = "github:issue-comment"
# The structured form of the same track:
# labels = ["bug"]            # instead of query; repo is required either way

# Optional: literal strings merged over the inherited environment for the
# harness subprocess only — how a track skill's scripts get configured.
# Uppercase names starting with a letter; TINA_* is reserved.
# [bug.env]
# TRIAGED_LABEL = "bot-triaged"
# BOT_LOGINS = "bot-one,bot-two"

# A sweep track has no queue: dispatch enqueues exactly one worker with no
# item, and the skill discovers, dedupes, and delivers the work itself.
# Queue keys (source, query, claim and failure policy) are invalid here;
# enabled, model, and env still apply.
[stuck-claims]
mode = "sweep"
track = "sweep-stuck-claims"
