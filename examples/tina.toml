# Example Tina configuration.
#
# `harness` and `executor` select an adapter by name. The adapters themselves
# are defined in the plural tables below — TOML will not let a key be both a
# string and a table.

harness = "pi"
executor = "local"
tracks_dir = "tracks"

# Runtime policy (paused, max_concurrency) lives in a separate control file,
# read fresh on every dispatch. Optional; absent means defaults. The env vars
# TINA_CONTROL and TINA_CONTROL_INLINE override it — see docs/control.md.
# control = "/mnt/config/control.toml"

[harnesses.pi]
command = ["pi", "--prompt-file", "{prompt_file}"]
# A command may also reference {model}; every track must then set `model`,
# so each track picks the model its work deserves:
# command = ["pi", "--prompt-file", "{prompt_file}", "--model", "{model}"]

[harnesses.claude]
command = ["claude", "-p", "@{prompt_file}", "--output-format", "json"]

[executors.cloudrun]
project = "acme-prod"
region = "us-central1"
job = "tina-worker"

# Every other table is a track: source -> skill -> result.

[vul]
source = "jira"
query = "project = VUL AND status = Open AND assignee IS EMPTY"
track = "remediate"         # skill name under tracks_dir; defaults to the key
result = "github:pr"        # declaration only — the agent produces it
# model = "claude-sonnet-x"   # substituted for {model} in the harness command;
#                             # required exactly when the command references it
# claim = "assign"            # how the worker claims (ADR-014): "assign" the
#                             # bot (default), "label" applies claim_label, or
#                             # "none" — no claim, dedupe is the query's job
# claim_label = "bot-claimed" # required with claim = "label"; the query must
#                             # exclude it. Jira:
#                             #   AND (labels IS EMPTY OR labels != "bot-claimed")
#                             # GitHub: -label:bot-claimed
# claim_transition = "In Progress"  # jira only: transition applied after a
#                             # successful claim, so the queued status stays true
# enabled = true              # false ships the track without running it
# on_failure = "leave"        # "annotate": after a failed, needs_human, or
#                             # unverified run, comment the outcome on the
#                             # item and apply blocked_label
# blocked_label = "tina-blocked"  # the label block() applies after a bad run.
# The query must exclude it, or blocked items match again. Jira:
#   AND (labels IS EMPTY OR labels != "tina-blocked")
# GitHub: -label:tina-blocked

[bug]
source = "github"
repo = "acme/api"
query = "repo:acme/api is:issue is:open no:assignee label:bug"
track = "triage"
result = "github:issue-comment"

# Optional: literal strings merged over the inherited environment for the
# harness subprocess only — how a track skill's scripts get configured.
# Uppercase names starting with a letter; TINA_* is reserved.
# [bug.env]
# TRIAGED_LABEL = "bot-triaged"
# BOT_LOGINS = "bot-one,bot-two"
